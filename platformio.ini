; pIRCIS -- an IRCIS interpreter for the Freenove FNK0114S, a 4.0"
; 320x480 ST7796 touch display on an ESP32, driven landscape at 480x320.
;
;   pio run -e st7796 -t upload -t monitor   build + flash + serial
;   pio run -e emulator -t exec              run it on this Mac in an SDL window
;
; Device-only and host-only sources guard themselves with SK_HOST, so both
; environments compile the whole of src/ and everything above the platform
; layer is shared: the interpreter, the program model, the UI and the console.

[platformio]
default_envs = st7796
; Build OUT of the Dropbox / CloudStorage tree. The file provider can
; re-materialise an older copy of a build artifact underneath a running
; build, which silently produces binaries that do not match the source --
; it cost a debugging session. Sources stay in Dropbox; objects do not.
build_dir = ~/.cache/pircis/build

[env]
build_flags = -std=gnu++17
build_unflags = -std=gnu++11 -std=gnu++14
; Applies to src/ only, so the vendored LovyanGFX does not drown the output.
; No -Wshadow: GCC flags the ported IRCIS `DataType(int value, bool is_integer)`
; constructor for shadowing its own members, which is ordinary C++, and this
; core is deliberately kept verbatim against upstream.
build_src_flags = -Wall -Wextra -Wno-unused-parameter

; --------------------------------------------------------------------------
; The board. Pin map and panel driver are in src/Config.h, taken from
; Freenove's own TFT_eSPI setup file rather than guessed.
; --------------------------------------------------------------------------
[env:st7796]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
lib_deps = lovyan03/LovyanGFX@^1.1.16
build_flags =
  ${env.build_flags}
  -DLGFX_USE_V1
  -DPANEL_ST7796=1
  -DIRCIS_TRAIL_LEN=24
  ; The Arduino loop task defaults to 8 KB. The UI runs entirely on it and the
  ; grid model is over 3 KB, so headroom here is cheap insurance -- RAM sits
  ; under 20% and a stack overflow on this core is a panic, not a glitch.
  -DARDUINO_LOOP_STACK_SIZE=16384

; Same board, ILI9488 controller. These 4" panels ship with either one; if
; st7796 gives a blank screen or wrong colours, flash this instead.
[env:ili9488]
extends = env:st7796
build_flags =
  ${env.build_flags}
  -DLGFX_USE_V1
  -DPANEL_ILI9488=1
  -DIRCIS_TRAIL_LEN=24

; --------------------------------------------------------------------------
; Desktop emulator: the real firmware against an SDL2 window, at the board's
; landscape resolution. Needs SDL2 (brew install sdl2).
; --------------------------------------------------------------------------
[env:emulator]
platform = native
extra_scripts = pre:tools/pio_macos_libcxx.py
lib_deps = lovyan03/LovyanGFX@^1.1.16
build_flags =
  ${env.build_flags}
  -DSK_HOST=1
  -DLGFX_USE_V1
  -DIRCIS_TRAIL_LEN=24
  -I/opt/homebrew/include/SDL2
  -L/opt/homebrew/lib
  -I/usr/local/include/SDL2
  -L/usr/local/lib
  -lSDL2
  -lpthread
