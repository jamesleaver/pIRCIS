name: Send in a program
description: An IRCIS program of yours, for the programs page
title: "Program: "
labels: [program]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sending one in. Paste the program below exactly as it runs in pIRCIS.
        If it is chosen it goes on the programs page under Contributed, with your name
        if you want it there.
  - type: input
    id: name
    attributes:
      label: Program name
      description: As it should appear on the page.
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: The program
      description: Every row the same length, up to 32 rows of 96 characters.
      render: text
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: What it does
      description: A sentence or two, and anything worth watching for while it runs.
  - type: input
    id: credit
    attributes:
      label: Your name, as it should appear
      description: Leave this empty to stay anonymous.
